proxy_cache_path /www/wwwroot/120.26.212.210/proxy_cache_dir levels=1:2 keys_zone=120_26_212_210_cache:20m inactive=1d max_size=5g;

# WebSocket 连接升级配置
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 120.26.212.210;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/120.26.212.210;
    
    include /www/server/panel/vhost/nginx/extension/120.26.212.210/*.conf;
    
    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/120.26.212.210.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START
    #error_page 404/404.html;
    #SSL-END

    #ERROR-PAGE-START
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START
    include enable-php-00.conf;
    #PHP-INFO-END

    #WEBSOCKET-SUPPORT START
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    #WEBSOCKET-SUPPORT END

    # ====================
    # 1. AI 服务（为 .NET 应用服务）
    # ====================
    location = /chat {
        proxy_pass http://127.0.0.1:5051/chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        
        # 跨域
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # ====================
    # 2. Yali 教学管理系统 - 后端API
    # ====================
    location /yali/api/ {
        rewrite ^/yali/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-Port $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header REMOTE-HOST $remote_addr;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        
        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # ====================
    # 3. Yali 教学管理系统 - WebSocket 连接
    # ====================
    location /yali/ws/ {
        rewrite ^/yali/ws/(.*)$ /ws/$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 特殊配置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # WebSocket 超时设置
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # ====================
    # 4. Yali AI 服务（Yali 专用智能助手）
    # ====================
    location /yali/ai-service/ {
        rewrite ^/yali/ai-service/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:5051;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        
        # 跨域
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # ====================
    # 5. Yali 文件存储
    # ====================
    location /yali/storage/ {
        alias /www/wwwroot/yali-storage/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ====================
    # 5.5. 资源文件访问（PPT、视频、试卷等）
    # ====================
    location /resources/ {
        alias /www/wwwroot/default/resources/;
        
        # 允许跨域访问
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
        
        # 处理OPTIONS预检请求
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
        
        # 支持断点续传
        add_header Accept-Ranges bytes;
        
        # 缓存设置（30天）
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # 处理中文文件名编码
        charset utf-8;
        
        # 自动索引（开发调试用，生产环境建议关闭）
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        
        # 日志
        access_log /www/wwwlogs/resources_access.log;
        error_log /www/wwwlogs/resources_error.log;
    }

    # ====================
    # 6. Yali 教学管理系统 - 前端（使用 /yali/ 路径）
    # ====================
    location /yali/ {
        # 不使用 rewrite，直接传递原始路径
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 禁用压缩，让 sub_filter 能工作
        proxy_set_header Accept-Encoding "";
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        
        # 替换HTML响应中的静态资源路径
        sub_filter 'src="/assets/' 'src="/yali/assets/';
        sub_filter 'href="/assets/' 'href="/yali/assets/';
        sub_filter "src='/assets/" "src='/yali/assets/";
        sub_filter "href='/assets/" "href='/yali/assets/";
        sub_filter_once off;
        sub_filter_types text/html;
    }
    
    # Yali 静态资源（assets）
    location /yali/assets/ {
        rewrite ^/yali/assets/(.*)$ /assets/$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        
        # 静态资源缓存
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ====================
    # 7. .NET 应用（占用根路径）
    # ====================
    location / {
        proxy_pass http://127.0.0.1:5005;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-Port $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header REMOTE-HOST $remote_addr;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ====================
    # 8. 安全配置
    # ====================
    
    # 禁止访问敏感文件
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    # SSL证书验证目录
    location /.well-known {
        allow all;
    }

    # 禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # ====================
    # 9. 日志
    # ====================
    access_log  /www/wwwlogs/120.26.212.210.log;
    error_log   /www/wwwlogs/120.26.212.210.error.log;
}
