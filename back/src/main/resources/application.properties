spring.application.name=back
server.port=8080

# 禁用 Spring DevTools 自动重启（防止验证码内存数据丢失）
spring.devtools.restart.enabled=false

# 禁用 docker compose
spring.docker.compose.enabled=false

# 允许Bean定义覆盖
spring.main.allow-bean-definition-overriding=true

# 数据库配置
spring.datasource.url=jdbc:mysql://47.96.254.64:3306/javaee?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=cuigu
spring.datasource.password=cuiguzjuter
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.type-aliases-package=cn.edu.zjut.back.entity

server.port=8080

# AI服务配置
ai.api.url=http://host.docker.internal:5052/chat

# HikariCP 连接池配置 - 优化远程数据库连接
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1000000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=10000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.keepalive-time=30000

# 数据库初始化（远程数据库已有表结构，禁用自动初始化）
spring.sql.init.mode=never
# spring.sql.init.schema-locations=classpath:schema.sql
# spring.sql.init.continue-on-error=true

# MyBatis 配置
mybatis.configuration.mapUnderscoreToCamelCase=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# JWT配置
jwt.secret=teaching-system-secret-key-2024
jwt.expiration=604800000

