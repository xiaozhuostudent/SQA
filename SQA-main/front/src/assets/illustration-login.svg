<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="tokyoBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7dcfff" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="tokyoPurple" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f7768e" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <g fill="none" fill-rule="evenodd">
    <!-- 背景装饰圆 -->
    <circle cx="650" cy="120" r="160" fill="url(#tokyoBlue)" opacity="0.12"/>
    <circle cx="700" cy="450" r="120" fill="url(#tokyoPurple)" opacity="0.1"/>
    
    <!-- 代码块元素 -->
    <g transform="translate(500,80)" opacity="0.15">
      <rect width="240" height="140" rx="12" fill="url(#tokyoBlue)"/>
      <rect x="16" y="16" width="60" height="8" rx="4" fill="#7dcfff"/>
      <rect x="16" y="36" width="140" height="6" rx="3" fill="#9ece6a"/>
      <rect x="16" y="52" width="100" height="6" rx="3" fill="#bb9af7"/>
      <rect x="16" y="68" width="180" height="6" rx="3" fill="#7aa2f7"/>
    </g>
    
    <!-- 终端窗口 -->
    <g transform="translate(520,300)" opacity="0.12">
      <rect width="260" height="180" rx="10" fill="#24283b" stroke="#7aa2f7" stroke-width="2"/>
      <circle cx="16" cy="16" r="5" fill="#f7768e"/>
      <circle cx="36" cy="16" r="5" fill="#ff9e64"/>
      <circle cx="56" cy="16" r="5" fill="#9ece6a"/>
      <path d="M16 40 L24 48 L16 56" stroke="#7dcfff" stroke-width="2" fill="none"/>
      <rect x="32" y="48" width="60" height="2" fill="#7dcfff" opacity="0.6"/>
    </g>
    
    <!-- 几何装饰 -->
    <g transform="translate(600,200)" opacity="0.08">
      <polygon points="0,40 40,0 80,40 40,80" fill="url(#tokyoPurple)"/>
    </g>
  </g>
</svg>