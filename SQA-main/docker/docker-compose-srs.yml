services:
  srs:
    image: ossrs/srs:5
    container_name: yali-srs
    ports:
      - "8000:1935"   # RTMP 推流端口
      - "1985:1985"   # HTTP API 端口
      - "8088:8080"   # HTTP-FLV/HLS 播放端口 (修改这里从8088:8088改为8088:8080)
    environment:
      - CANDIDATE=localhost
    restart: unless-stopped
    networks:
      - yali-network

networks:
  yali-network:
    driver: bridge
