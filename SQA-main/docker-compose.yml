# ==========================================
# JavaEE 课程管理系统 - 主 Docker Compose
# ==========================================
# 包含所有服务：后端、前端、AI服务、SRS流媒体
# 使用远程 MySQL 数据库（120.26.212.210）
# ==========================================

version: '3.8'

services:
  # ==========================================
  # MySQL 数据库（本地）
  # ==========================================
  mysql:
    image: mysql:8.4
    container_name: yali-mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root123456
      - MYSQL_DATABASE=javaee
      - MYSQL_USER=javaee
      - MYSQL_PASSWORD=Yali123456
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sqls/javaee.sql:/docker-entrypoint-initdb.d/javaee.sql
    restart: unless-stopped
    networks:
      - yali-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ==========================================
  # Redis 缓存服务
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: yali-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123456 --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - yali-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ==========================================
  # 后端服务 (Spring Boot)
  # ==========================================
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: yali-backend
    ports:
      - "8080:8080"
    environment:
      # 数据库配置（远程MySQL服务器）
      - SPRING_DATASOURCE_URL=jdbc:mysql://47.96.254.64:3306/javaee?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=cuigu
      - SPRING_DATASOURCE_PASSWORD=cuiguzjuter
      # Redis配置（本地容器）
      - SPRING_DATA_REDIS_HOST=yali-redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=redis123456
      # 应用配置
      - SERVER_PORT=8080
      - JAVA_OPTS=-Xmx512m -Xms256m
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - yali-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/course/all"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==========================================
  # 前端服务 (Vue3 + Vite)
  # ==========================================
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: yali-frontend
    ports:
      - "3001:3001"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
      - VITE_AI_BASE_URL=http://localhost:5051
    volumes:
      - ./front/src:/app/src
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - yali-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================
  # AI 服务 (Flask) - 直接本地运行，不走 Docker
  # 启动方式：cd ai-service && pip install -r requirements.txt && python AI.py
  # ==========================================
  # ai-service:
  #   build:
  #     context: ./ai-service
  #     dockerfile: Dockerfile
  #   container_name: yali-ai
  #   ports:
  #     - "5051:5051"
  #   environment:
  #     - FLASK_ENV=production
  #     - PYTHONUNBUFFERED=1
  #   volumes:
  #     - ./logs:/app/logs
  #   restart: unless-stopped
  #   networks:
  #     - yali-network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:5051"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 20s

  # ==========================================
  # SRS 流媒体服务器
  # ==========================================
  srs:
    image: ossrs/srs:5
    container_name: yali-srs
    ports:
      - "8000:1935"   # RTMP 推流端口
      - "1985:1985"   # HTTP API 端口
      - "8088:8080"   # HTTP-FLV/HLS 播放端口
    environment:
      - CANDIDATE=localhost
    volumes:
      - ./docker/srs.conf:/usr/local/srs/conf/srs.conf
      - ./srs-data:/usr/local/srs/objs/nginx/html
    restart: unless-stopped
    networks:
      - yali-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1985/api/v1/versions"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # OnlyOffice 文档服务器
  # ==========================================
  onlyoffice:
    image: onlyoffice/documentserver:7.5
    container_name: yali-onlyoffice
    ports:
      - "8081:80"     # HTTP 端口
      - "8443:443"    # HTTPS 端口（可选）
    environment:
      - JWT_ENABLED=false
      - JWT_SECRET=yali-secret-key-2024
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
      - onlyoffice-fonts:/usr/share/fonts/truetype/custom
      - onlyoffice-forgotten:/var/lib/onlyoffice/documentserver/App_Data/cache/files/forgotten
    restart: unless-stopped
    networks:
      - yali-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# ==========================================
# 网络配置
# ==========================================
networks:
  yali-network:
    driver: bridge
    name: yali-network

# ==========================================
# 数据卷配置
# ==========================================
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  storage-data:
    driver: local
  logs-data:
    driver: local
  onlyoffice-data:
    driver: local
  onlyoffice-logs:
    driver: local
  onlyoffice-fonts:
    driver: local
  onlyoffice-forgotten:
    driver: local
