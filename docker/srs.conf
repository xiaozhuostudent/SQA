listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8088;
    dir             ./objs/nginx/html;
}

http_api {
    enabled         on;
    listen          1985;
}

# 添加 rtc_server 配置（可选，用于WebRTC）
rtc_server {
    enabled         on;
    listen          8000;
    # 对于本地开发，candidate 通常不需要设置
    # candidate $CANDIDATE;
}

stats {
    network         0;
    disk            sda vda xvda xvdb;
}

vhost __defaultVhost__ {
    # RTMP 配置 - 必须放在最前面
    rtmp {
        enabled     on;
    }
    
    # HLS 配置
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    10;
        hls_window      60;
    }
    
    # HTTP-FLV 配置
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    
    # WebRTC 配置（可选）
    rtc {
        enabled     on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
    }
    
    # DVR 录制（可选）
    dvr {
        enabled         off;
        dvr_path        ./objs/nginx/html/[app]/[stream].[timestamp].flv;
        dvr_plan        session;
    }
}